[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datadelta"
version = "0.1.0"
description = "Align the records of two versions of a dataset and report what was added, removed and edited."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["dataset", "diff", "data-versioning", "record-linkage", "drift"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/vipul21435/datadelta"

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "scipy>=1.10"]

[project.scripts]
datadelta = "datadelta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datadelta"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
